name: Sync Edge Dev Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Edge Dev from APKMirror
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: "microsoft-corporation"
          repo: "microsoft-edge-dev"
          bundle: false

      - name: Find Version and Rename APK
        id: prep
        run: |
          APK_FILE=$(ls *.apk | head -n 1)
          VERSION=$(echo "$APK_FILE" | grep -oP '\d+\.\d+\.\d+\.\d+' || echo "152.0.4191.35")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "FILE=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.prep.outputs.VERSION }}"
          name: "Microsoft Edge Dev ${{ steps.prep.outputs.VERSION }}"
          files: "*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
