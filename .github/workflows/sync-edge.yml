name: Sync Edge Dev Releases

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every 24 hours
  workflow_dispatch: # Allows manual triggers

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Edge Dev from APKMirror
        uses: Yakov5776/gh-apkmirror-dl@v1
        with:
          org: "microsoft-corporation"
          repo: "microsoft-edge-dev"
          file_name: "edge-dev.apk"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Microsoft Edge Dev Release"
          files: "edge-dev.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
