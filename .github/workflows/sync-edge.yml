name: Sync Edge Dev Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Edge Dev APK
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: "microsoft-corporation"
          repo: "microsoft-edge-dev"
          bundle: false

      - name: Extract Version and Rename Asset
        id: prep
        run: |
          # Find the downloaded APK file
          RAW_FILE=$(ls *.apk | head -n 1)
          
          # Extract numerical version (e.g., 152.0.4191.35)
          VERSION=$(echo "$RAW_FILE" | grep -oP '\d+\.\d+\.\d+\.\d+' || echo "152.0.4191.35")
          
          # Rename to a clean standard name
          mv "$RAW_FILE" "edge-dev.apk"
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.prep.outputs.VERSION }}"
          name: "Microsoft Edge Dev ${{ steps.prep.outputs.VERSION }}"
          files: "edge-dev.apk"
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
