name: Sync Edge Dev Releases

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically once every 24 hours
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Edge Dev APK
        run: |
          # Query APKMirror RSS Feed for Microsoft Edge Dev
          RSS_URL="https://www.apkmirror.com/apk/microsoft-corporation/microsoft-edge-dev/feed/"
          LATEST_URL=$(curl -sL "$RSS_URL" | grep -oP 'https://www.apkmirror.com/apk/microsoft-corporation/microsoft-edge-dev/microsoft-edge-dev-[^"]+' | head -n 1)
          
          echo "Found latest version page: $LATEST_URL"
          
          # Extract Version String
          VERSION=$(echo "$LATEST_URL" | grep -oP '\d+\.\d+\.\d+\.\d+' || echo "latest")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download and Package Asset
        run: |
          # Fetch APK using simple-get/curl placeholder
          # Note: Scraping APKMirror directly requires Cloudflare bypass headers in standard setups.
          # Create placeholder binary build step for release pipeline validation:
          mkdir -p output
          echo "Edge Dev Version ${{ env.VERSION }}" > output/release-notes.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Microsoft Edge Dev v${{ env.VERSION }}"
          body_path: output/release-notes.txt
          files: |
            output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
