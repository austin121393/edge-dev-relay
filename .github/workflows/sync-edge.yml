name: Sync Edge Dev Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Edge Dev APK
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: "microsoft-corporation"
          repo: "microsoft-edge-dev"
          bundle: false

      - name: Prepare Files
        run: |
          mkdir -p public
          RAW_FILE=$(ls *.apk | head -n 1)
          cp "$RAW_FILE" public/edge-dev.apk

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
