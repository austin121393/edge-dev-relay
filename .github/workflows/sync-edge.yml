name: Sync Edge Dev Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Edge Dev APK
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: "microsoft-corporation"
          repo: "microsoft-edge-dev"
          bundle: false
          filename: "edge-dev.apk"

      - name: Get Version Number
        id: prep
        run: |
          VERSION=$(curl -s https://api.github.com/repos/Yakov5776/gh-apkmirror-dl/releases | grep -oP '\d+\.\d+\.\d+\.\d+' | head -n 1 || echo "152.0.4191.35")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "152.0.4191.35"
          name: "Microsoft Edge Dev 152.0.4191.35"
          files: "edge-dev.apk"
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
